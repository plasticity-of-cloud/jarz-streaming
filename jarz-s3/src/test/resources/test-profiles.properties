# Test profiles for S3 ClassLoader testing

# Real S3 testing (requires AWS credentials)
test.profile.s3.enabled=${JARZ_S3_TEST_ENABLED:false}
test.profile.s3.region=${AWS_REGION:us-east-1}
test.profile.s3.bucket=${JARZ_S3_TEST_BUCKET:}

# MinIO testing (alternative local S3)
test.profile.minio.enabled=false
test.profile.minio.endpoint=http://localhost:9000
test.profile.minio.region=us-east-1
test.profile.minio.bucket=test-jarz-bucket
test.profile.minio.access-key=minioadmin
test.profile.minio.secret-key=minioadmin

# Test configuration
test.class.count=50
test.class.size.min=1024
test.class.size.max=10240
test.concurrent.requests=5
test.cache.size=10485760
