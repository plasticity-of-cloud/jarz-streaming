version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    reviewers:
      - "plasticity-cloud/jarz-maintainers"
    assignees:
      - "plasticity-cloud/jarz-maintainers"
    commit-message:
      prefix: "deps"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "plasticity-cloud/jarz-maintainers"
    assignees:
      - "plasticity-cloud/jarz-maintainers"
    commit-message:
      prefix: "ci"
      include: "scope"
