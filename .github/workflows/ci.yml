name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-amd64:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        architecture: x64

    - name: Cache Maven dependencies
      uses: actions/cache@v5
      with:
        path: ~/.m2
        key: ${{ runner.os }}-x64-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-x64-maven-

    - name: Build with Maven
      run: mvn clean install -Pmulti-release -DskipTests

    - name: Run tests
      run: mvn test

    - name: Upload test results
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: test-results-amd64-java21
        path: |
          **/target/surefire-reports/
          **/target/failsafe-reports/

  build-arm64:
    runs-on: ubuntu-24.04-arm64
    # Only run ARM builds for public repositories
    if: github.event.repository.private == false
    steps:
    - uses: actions/checkout@v6

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        architecture: arm64

    - name: Cache Maven dependencies
      uses: actions/cache@v5
      with:
        path: ~/.m2
        key: ${{ runner.os }}-arm64-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-arm64-maven-

    - name: Build with Maven
      run: mvn clean install -Pmulti-release -DskipTests

    - name: Run tests
      run: mvn test

    - name: Upload test results
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: test-results-arm64-java21
        path: |
          **/target/surefire-reports/
          **/target/failsafe-reports/
