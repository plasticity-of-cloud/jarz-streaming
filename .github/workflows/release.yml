name: Release

on:
  release:
    types: [published]

jobs:
  build-amd64:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        architecture: x64

    - name: Cache Maven dependencies
      uses: actions/cache@v5
      with:
        path: ~/.m2
        key: ${{ runner.os }}-x64-maven-${{ hashFiles('**/pom.xml') }}

    - name: Build and package
      run: mvn clean install

    - name: Upload release artifacts
      uses: actions/upload-artifact@v6
      with:
        name: jarz-amd64-java21-${{ github.ref_name }}
        path: |
          **/target/*.jar
          !**/target/*-sources.jar
          !**/target/*-javadoc.jar

  build-arm64:
    runs-on: ubuntu-latest-arm
    # Only run ARM builds for public repositories
    if: github.event.repository.private == false
    steps:
    - uses: actions/checkout@v6

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        architecture: arm64

    - name: Cache Maven dependencies
      uses: actions/cache@v5
      with:
        path: ~/.m2
        key: ${{ runner.os }}-arm64-maven-${{ hashFiles('**/pom.xml') }}

    - name: Build and package
      run: mvn clean install

    - name: Upload release artifacts
      uses: actions/upload-artifact@v6
      with:
        name: jarz-arm64-java21-${{ github.ref_name }}
        path: |
          **/target/*.jar
          !**/target/*-sources.jar
          !**/target/*-javadoc.jar
